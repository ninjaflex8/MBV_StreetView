<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F3EE">
    <title>Entrar | MBV StreetView</title>
    <script src="../js/theme.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo" class="login-container" tabindex="-1">
    <p class="eyebrow">MBV STREETVIEW / SUA CONTA</p>
    <h1>Entrar</h1>

    <form id="loginForm" autocomplete="on">
        <div class="input-group">
            <label for="loginEmail">E-mail</label>
            <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="seu@email.com"
                    maxlength="100"
                    autocomplete="username"
                    required
            >
        </div>

        <div class="input-group">
            <label for="loginSenha">Senha</label>
            <input
                    type="password"
                    id="loginSenha"
                    name="senha"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
            >
        </div>

        <label class="remember-email" for="rememberEmail">
            <input type="checkbox" id="rememberEmail">
            <span>Lembrar meu e-mail neste dispositivo</span>
        </label>

        <button id="loginButton" type="submit">Entrar</button>
        <p class="message" id="loginMessage" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>

    <a href="paginaderegistro.html" class="register-link">
        Não tem uma conta? Cadastre-se
    </a>
    <a href="../index.html" class="register-link">Voltar à loja</a>
</main>

<script src="../js/config.js" defer></script>
<script src="../js/login.js" defer></script>
</body>
</html>
