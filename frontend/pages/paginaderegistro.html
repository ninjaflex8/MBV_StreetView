<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F5F3EE">
    <title>Criar conta | MBV StreetView</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="register-page">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
<div class="account-page-layout">
    <section class="page-carousel" data-carousel data-image-base="../imagens/" role="region" aria-roledescription="carrossel" aria-label="Destaques da coleção MBV">
        <div class="page-carousel-frame">
            <img data-carousel-image src="../imagens/camisa_brooklyn.jpg" alt="Camiseta Brooklyn da coleção MBV StreetView">
            <span class="page-carousel-count" data-carousel-count aria-hidden="true">MBV / 001</span>
            <button class="carousel-control carousel-previous" data-carousel-previous type="button" aria-label="Ver imagem anterior do destaque">‹</button>
            <button class="carousel-control carousel-next" data-carousel-next type="button" aria-label="Ver próxima imagem do destaque">›</button>
            <button class="carousel-toggle" data-carousel-toggle type="button" aria-label="Pausar carrossel">Ⅱ</button>
            <div class="page-carousel-progress" data-carousel-progress role="progressbar" aria-label="Tempo até a próxima imagem" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
        </div>
        <p class="visually-hidden" data-carousel-status role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
<main id="conteudo" class="register-container" tabindex="-1">
    <p class="eyebrow">MBV STREETVIEW / SUA CONTA</p>
    <h1>Criar conta</h1>
    <p>Preencha os campos para criar sua conta de cliente.</p>
    <form id="registerForm">
        <div class="form-group">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Seu nome" minlength="3" maxlength="30" autocomplete="name" required>
        </div>
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" maxlength="100" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="De 6 a 50 caracteres" minlength="6" maxlength="50" autocomplete="new-password" required>
        </div>
        <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" minlength="6" maxlength="50" autocomplete="new-password" required>
        </div>
        <div class="form-actions">
            <button id="cadastro_BTN" type="submit">Cadastrar</button>
            <a id="login_BTN" class="button button-dark" href="areadelogin.html" hidden>Ir para login</a>
        </div>
        <p class="msg" id="message" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <a href="../index.html" class="register-link">Voltar à loja</a>
</main>
</div>

<script src="../js/config.js" defer></script>
<script src="../js/carousel.js" defer></script>
<script src="../js/register.js" defer></script>
</body>
</html>
